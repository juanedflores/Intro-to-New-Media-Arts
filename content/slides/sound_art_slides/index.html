<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Week 1 - Contemporary Kinetic Art Showcase</title>

  <link rel="stylesheet" href="../_shared/reveal/dist/reveal.css" />
  <link rel="stylesheet" href="../_shared/reveal/dist/theme/white.css" />
  <link rel="stylesheet" href="css/artistwebsite.css" />
  <link rel="stylesheet" href="../_shared/reveal/css/uikit.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-plugins/menu/font-awesome/css/fontawesome.css">
  <script src="../_shared/reveal/js/uikit.min.js"></script>

  <style>
    @font-face {
      font-family: "LinLibertine_Rah";
      src: url("../../fonts/LinLibertine_Rah.ttf");
    }

    .make-it-pop {
      filter: drop-shadow(0 0 10px purple);
    }
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section class="uk-card-small uk-card-default uk-card-body uk-box-shadow-xlarge"
        data-markdown="creative_coding.md" data-separator-notes="^Note:" data-charset="iso-8859-15">
      </section>
      <!--data-markdown="creative_coding.md"-->
    </div>
  </div>
  </div>

  <script src="../_shared/reveal/dist/reveal.js"></script>
  <script src="../_shared/reveal/plugin/markdown/markdown.js"></script>
  <script src="../_shared/reveal/plugin/notes/notes.js"></script>
  <script src="../_shared/reveal/plugin/highlight/highlight.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link rel="stylesheet" href="../_shared/reveal/plugin/highlight/zenburn.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // More info about initialization & config:
    // - https://revealjs.com/initialization/
    // - https://revealjs.com/config/
    Reveal.initialize({
      hash: true,
      controls: true,
      controlsTutorial: false,
      progress: false,
      transition: 'fade',
      hideCursorTime: 100,
      highlight: {
      },
      plugins: [RevealMarkdown, RevealNotes, RevealHighlight],
    });
    Reveal.on('make-it-pop', () => {
      console.log('✨');
    });
  </script>
</body>

</html>
