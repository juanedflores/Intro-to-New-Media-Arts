<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Three microphones wired to one speaker. An electret microphone hears waves in the air, a contact microphone taped to a box hears the box shake, and a coil hears the magnetic field around a charger.">
  <!-- Labels are Alegreya Sans (fonts/alegreya). Same palette as Final_Project/images/cover.png. -->
  <rect width="800" height="450" fill="#f2dcbf"/>

  <!-- dashed signal lines into the speaker -->
  <g fill="none" stroke="#5f6570" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 8">
    <path d="M300 86 C 400 86, 440 205, 560 222"/>
    <path d="M352 225 H560"/>
    <path d="M312 364 C 410 364, 440 245, 560 228"/>
  </g>

  <!-- 1. electret: the air -->
  <text x="34" y="97" font-family="Alegreya Sans" font-weight="800" font-size="31" fill="#1d2433">air</text>
  <g fill="none" stroke="#2f64b7" stroke-width="6" stroke-linecap="round">
    <path d="M104 50 Q128 86 104 122"/>
    <path d="M132 58 Q150 86 132 114"/>
    <path d="M160 66 Q172 86 160 106"/>
  </g>
  <rect x="196" y="48" width="104" height="76" rx="10" fill="#2f64b7"/>
  <circle cx="212" cy="62" r="4" fill="#fbc740"/>
  <circle cx="212" cy="110" r="4" fill="#fbc740"/>
  <circle cx="284" cy="62" r="4" fill="#fbc740"/>
  <circle cx="284" cy="86" r="4" fill="#fbc740"/>
  <circle cx="284" cy="110" r="4" fill="#fbc740"/>
  <circle cx="246" cy="86" r="27" fill="#9a9aa2"/>
  <circle cx="246" cy="86" r="18" fill="#1d2433"/>
  <g fill="#9a9aa2">
    <circle cx="246" cy="86" r="2.6"/>
    <circle cx="238" cy="80" r="2.6"/><circle cx="254" cy="80" r="2.6"/>
    <circle cx="238" cy="92" r="2.6"/><circle cx="254" cy="92" r="2.6"/>
  </g>

  <!-- 2. contact mic: the object -->
  <text x="34" y="235" font-family="Alegreya Sans" font-weight="800" font-size="31" fill="#1d2433">objects</text>
  <rect x="174" y="222" width="150" height="70" rx="5" fill="#c98f4e"/>
  <rect x="174" y="222" width="150" height="12" rx="4" fill="#b07a3c"/>
  <ellipse cx="249" cy="220" rx="46" ry="13" fill="#d6a020"/>
  <ellipse cx="249" cy="217.5" rx="28" ry="7.5" fill="#fffaf3"/>
  <!-- the box shaking -->
  <g fill="none" stroke="#d53f32" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M163 236 l-9 9 l9 9 l-9 9 l9 9"/>
    <path d="M335 236 l9 9 l-9 9 l9 9 l-9 9"/>
  </g>
  <path d="M292 218 C 310 211, 332 216, 352 225" fill="none" stroke="#1d2433" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 3. coil: electromagnetic fields -->
  <text x="34" y="375" font-family="Alegreya Sans" font-weight="800" font-size="31" fill="#1d2433">fields</text>
  <rect x="124" y="334" width="10" height="13" rx="2" fill="#9a9aa2"/>
  <rect x="124" y="381" width="10" height="13" rx="2" fill="#9a9aa2"/>
  <rect x="132" y="326" width="42" height="76" rx="8" fill="#1d2433"/>
  <path d="M157 342 L144 367 H153 L148 387 L163 359 H154 Z" fill="#fbc740"/>
  <g fill="none" stroke="#2f64b7" stroke-width="5" stroke-linecap="round">
    <path d="M186 344 Q202 364 186 384"/>
    <path d="M200 333 Q224 364 200 395"/>
  </g>
  <g fill="none" stroke="#b8622e" stroke-width="5">
    <ellipse cx="240" cy="364" rx="7" ry="29"/>
    <ellipse cx="252" cy="364" rx="7" ry="29"/>
    <ellipse cx="264" cy="364" rx="7" ry="29"/>
    <ellipse cx="276" cy="364" rx="7" ry="29"/>
    <ellipse cx="288" cy="364" rx="7" ry="29"/>
  </g>
  <path d="M296 364 H312" fill="none" stroke="#b8622e" stroke-width="5" stroke-linecap="round"/>

  <!-- speaker -->
  <rect x="580" y="199" width="28" height="52" fill="#1d2433"/>
  <path d="M606 199 L652 165 V285 L606 251 Z" fill="#1d2433" stroke="#1d2433" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#d53f32" stroke-width="7" stroke-linecap="round">
    <path d="M672 203 Q686 225 672 247"/>
    <path d="M692 184 Q716 225 692 266"/>
    <path d="M712 165 Q746 225 712 285"/>
  </g>
</svg>
