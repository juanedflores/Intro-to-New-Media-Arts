<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 760 372" role="img" aria-label="Wiring diagram: the Nano 33 IoT's A0 pin goes to the plus leg of a 10 microfarad capacitor, then through a 1 kilohm resistor to the tip and ring of a 3.5 millimeter aux plug. The Nano's GND pin goes to the plug's sleeve. The aux cable goes to an amplified speaker. Below, two graphs: at A0 the wave sits between 0 and 3.3 volts, centered on 1.65 volts; after the capacitor the same wave is centered on 0 volts." font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="52" width="760" height="372" fill="#fff"/>

  <!-- Nano 33 IoT -->
  <rect x="30" y="70" width="140" height="190" rx="8" fill="#1f8a94"/>
  <rect x="44" y="84" width="34" height="22" rx="3" fill="#c9cdd2"/>
  <text x="100" y="170" fill="#fff" font-weight="700" text-anchor="middle">Nano 33 IoT</text>
  <circle cx="170" cy="120" r="6" fill="#f3c95b" stroke="#2c3f89" stroke-width="2"/>
  <circle cx="170" cy="230" r="6" fill="#f3c95b" stroke="#2c3f89" stroke-width="2"/>
  <text x="156" y="125" fill="#fff" font-weight="700" text-anchor="end">A0 (DAC)</text>
  <text x="156" y="235" fill="#fff" font-weight="700" text-anchor="end">GND</text>

  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- A0 to capacitor -->
    <path d="M176 120 H238" stroke="#d9a400"/>
    <!-- capacitor: straight + plate, curved – plate -->
    <path d="M238 98 V142" stroke="#2c3f89"/>
    <path d="M258 98 Q248 120 258 142" stroke="#2c3f89"/>
    <!-- capacitor to resistor -->
    <path d="M252 120 H320" stroke="#d9a400"/>
    <!-- resistor -->
    <path d="M320 120 l6 -10 l12 20 l12 -20 l12 20 l12 -20 l12 20 l14 -10" stroke="#2c3f89"/>
    <!-- resistor to plug tip -->
    <path d="M400 120 H494" stroke="#d9a400"/>
    <!-- GND to plug sleeve -->
    <path d="M176 230 H494" stroke="#222"/>
    <!-- aux cable to the speaker -->
    <path d="M570 175 C600 175 600 175 640 175" stroke="#555" stroke-width="6"/>
  </g>

  <text x="230" y="96" fill="#c0392b" font-weight="700" text-anchor="end">+</text>
  <text x="248" y="80" font-weight="700" text-anchor="middle">10µF</text>
  <text x="248" y="164" fill="#666" font-size="11" text-anchor="middle">+ leg toward A0</text>
  <text x="360" y="96" font-weight="700" text-anchor="middle">1kΩ</text>

  <!-- 3.5 mm plug -->
  <rect x="500" y="96" width="70" height="158" rx="10" fill="#e4e4e4" stroke="#9a9a9a" stroke-width="2"/>
  <circle cx="500" cy="120" r="6" fill="#c9cdd2" stroke="#555" stroke-width="2"/>
  <circle cx="500" cy="230" r="6" fill="#c9cdd2" stroke="#555" stroke-width="2"/>
  <text x="514" y="116" font-size="11" font-weight="700">TIP +</text>
  <text x="514" y="130" font-size="11" font-weight="700">RING</text>
  <text x="514" y="234" font-size="11" font-weight="700">SLEEVE</text>
  <text x="535" y="275" fill="#666" font-size="11" text-anchor="middle">3.5 mm aux plug</text>

  <!-- amplified speaker -->
  <rect x="640" y="110" width="96" height="130" rx="10" fill="#2a2a2a"/>
  <circle cx="688" cy="160" r="30" fill="#444" stroke="#777" stroke-width="2"/>
  <circle cx="688" cy="160" r="10" fill="#666"/>
  <circle cx="688" cy="218" r="9" fill="#444" stroke="#777" stroke-width="2"/>
  <text x="688" y="262" fill="#666" font-size="11" text-anchor="middle">amplified speaker</text>
  <text x="688" y="276" fill="#666" font-size="11" text-anchor="middle">(aux in)</text>

  <!-- what the capacitor does -->
  <line x1="30" y1="300" x2="730" y2="300" stroke="#e7dccd" stroke-width="2"/>

  <text x="120" y="328" font-weight="700" text-anchor="middle">At A0</text>
  <line x1="40" y1="395" x2="200" y2="395" stroke="#222" stroke-width="1.5"/>
  <line x1="40" y1="368" x2="200" y2="368" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M40 368 q20 -50 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="206" y="399" font-size="11">0V</text>
  <text x="206" y="372" font-size="11" fill="#666">1.65V</text>
  <text x="120" y="414" fill="#666" font-size="11" text-anchor="middle">swings between 0V and 3.3V</text>

  <path d="M290 368 H350" fill="none" stroke="#2c3f89" stroke-width="2.5"/>
  <path d="M350 368 l-10 -6 v12 z" fill="#2c3f89"/>
  <text x="320" y="356" font-size="11" text-anchor="middle">capacitor</text>

  <text x="520" y="328" font-weight="700" text-anchor="middle">After the capacitor</text>
  <line x1="440" y1="368" x2="600" y2="368" stroke="#222" stroke-width="1.5"/>
  <path d="M440 368 q20 -50 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#2c3f89" stroke-width="2.5"/>
  <text x="606" y="372" font-size="11">0V</text>
  <text x="520" y="414" fill="#666" font-size="11" text-anchor="middle">the same wave, centered on 0V</text>
</svg>
