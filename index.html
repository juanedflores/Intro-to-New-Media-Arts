      <!-- THE LEFT SIDEBAR ON DESKTOP -->

      <!-- WHERE THE WEEK CONTENT WILL GO -->
      <div id="right-col"></div>
    </div>
    <script>
      // ==== WEEKLY UPDATE: change CURRENT_WEEK, nothing else ====
      const CURRENT_WEEK = 7;
      const TOTAL_WEEKS = 15;
      // ============================================================
      renderWeekNav(CURRENT_WEEK, TOTAL_WEEKS);
      // open the week in the address (index.html#week-4), else this week;
      // weeks that haven't started yet stay locked
      var linkedWeek = weekFromHash();
      if (location.hash === "#syllabus") load_syllabus(true);
      else if (location.hash === "#topics") load_topics(true);
      else if (location.hash === "#resources") load_resources(true);
      else
        loadWeek(
          linkedWeek && linkedWeek <= CURRENT_WEEK ? linkedWeek : CURRENT_WEEK,
          true,
        );
    </script>
